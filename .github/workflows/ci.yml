name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dating
          POSTGRES_PASSWORD: dating
          POSTGRES_DB: dating
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dating -d dating"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dating:dating@localhost:5432/dating
      DIRECT_DATABASE_URL: postgresql://dating:dating@localhost:5432/dating
      TEST_DATABASE_URL: postgresql://dating:dating@localhost:5432/dating
      REDIS_URL: redis://localhost:6380
      JWT_ACCESS_SECRET: ci-access-secret-must-be-long-enough-32
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-long-enough-32
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: Dating Platform <no-reply@dating.local>
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: dating-storage
      STORAGE_SECRET_KEY: dating-storage-secret
      STORAGE_UPLOAD_BUCKET: dating-test-uploads
      STORAGE_MEDIA_BUCKET: dating-test-media
      STORAGE_PUBLIC_URL: http://localhost:9000/dating-test-media
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_AUTO_PROVISION: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @dating/web build
